[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-dreamhub"
dynamic = ["version"]
description = "Apache Airflow provider for Dreamhub: extract records to files or object storage and load records in bulk."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Dreamhub" }]
keywords = ["airflow", "airflow-provider", "dreamhub", "crm", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "apache-airflow>=2.9.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
]
lint = [
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/dreamhub-ai/airflow-provider-dreamhub"
Issues = "https://github.com/dreamhub-ai/airflow-provider-dreamhub/issues"

[project.entry-points.apache_airflow_provider]
provider_info = "dreamhub_airflow.get_provider_info:get_provider_info"

[tool.hatch.version]
path = "dreamhub_airflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dreamhub_airflow"]

[tool.hatch.build.targets.sdist]
include = ["dreamhub_airflow", "tests", "example_dags", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests against a real Dreamhub environment (needs DREAMHUB_E2E_URL and DREAMHUB_E2E_TOKEN)",
]

[tool.coverage.run]
source = ["dreamhub_airflow"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
